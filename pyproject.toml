[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-solver-opt"
version = "0.1.0"
description = "Capture and record Hermes-3 performance tests for solver optimisation"
requires-python = ">=3.10"
# The Spack environment provides these; they are listed so an install fails
# loudly rather than at first import. xhermes is only needed by the tests, and
# is not on PyPI, so it is not listed.
dependencies = ["numpy", "pandas", "xarray"]

[project.scripts]
# Named with the .py suffix the tools have always carried, so every documented
# command keeps working after the move off $PATH.
"extract_test.py" = "perftest.cli.extract_test:main"
"verify_store.py" = "perftest.cli.verify_store:main"

[tool.setuptools.packages.find]
include = ["perftest*"]
